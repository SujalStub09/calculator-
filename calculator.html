<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaScript Calculator</title>

    <link rel="stylesheet" href="calculator.css">
</head>

<body>

    <div class="calculator">

        <!-- Input -->
        <div class="inputs">

            <input type="number" id="num1" placeholder="Enter number">

            <input type="number" id="num2" placeholder="Enter number">

        </div>


        <!-- Buttons -->
        <div class="buttons">

            <button id="add">Addition</button>

            <button id="sub">Subtraction</button>

            <button id="mul">Multiplication</button>

            <button id="div">Division</button>

            <button id="exp">Exponential</button>

            <button id="rem">Remainder</button>

            <button id="reset">Reset</button>

        </div>


        <!-- Result -->
        <div class="result">

            <h3>Result:</h3>

            <div id="output"></div>

        </div>

    </div>


    <script src="calculator.js"></script>

</body>
</html>
